version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: bakery_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: bakery_db
      MYSQL_USER: bakery_user
      MYSQL_PASSWORD: bakery123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bakery-network

  # Flask Backend
  # Flask Backend
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: bakery_backend
    restart: always
    ports:
      - "5001:5000"
    environment:
      FLASK_APP: main.py
      FLASK_ENV: development
      # ... (giữ nguyên các dòng MAIL_... cũ) ...
      MAIL_SERVER: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USE_TLS: "True"
      MAIL_USE_SSL: "False"
      MAIL_USERNAME: "thachnb.mathtech@gmail.com"
      MAIL_PASSWORD: "rpiziafljmspbwkc"
      MAIL_DEFAULT_SENDER: "hus_bakery <thachnb.mathtech@gmail.com>"
      DB_URI: mysql+pymysql://bakery_user:bakery123@mysql:3306/bakery_db
      SQLALCHEMY_DATABASE_URI: mysql+pymysql://bakery_user:bakery123@mysql:3306/bakery_db
      SECRET_KEY: nguyenbaothach
      JWT_SECRET_KEY: hus_bakery_backend
      
      # 👇 THÊM 2 DÒNG NÀY VÀO 👇
      # Đây là địa chỉ thật trên mạng của trang web (không dùng localhost nữa)
      FRONTEND_URL: "https://husbakery.duckdns.org"
      FRONTEND_ADMIN_URL: "https://husbakery.duckdns.org" 
      # (Lưu ý: Nếu trang Admin bạn cài domain khác, ví dụ admin.husbakery... thì sửa lại dòng trên)

    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bakery-network

  # Frontend User (Customer Website)
  frontend-user:
    build: 
      context: ./frontend-user
      dockerfile: Dockerfile
    container_name: bakery_frontend_user
    ports:
      - "3000:5173" 
    volumes:
      - ./frontend-user:/app
      - /app/node_modules
      - /app/dist
    environment:
      # --- ĐÃ SỬA: Dùng HTTPS và bỏ port 5001 ---
      VITE_API_URL: https://husbakery.duckdns.org/api
      VITE_APP_NAME: "Bakery Shop"
    depends_on:
      - backend
    stdin_open: true
    tty: true
    command: npm run dev -- --host 0.0.0.0 --port 5173
    networks:
      - bakery-network

  # Frontend Admin
  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: bakery_frontend_admin
    ports:
      - "3001:5173"
    volumes:
      - ./frontend-admin:/app
      - /app/node_modules
      - /app/dist
    environment:
      # --- ĐÃ SỬA: Dùng HTTPS và bỏ port 5001 ---
      VITE_API_URL: https://husbakery.duckdns.org/api
      VITE_APP_NAME: "Bakery Admin"
    depends_on:
      - backend
    stdin_open: true
    tty: true
    command: npm run dev -- --host 0.0.0.0 --port 5173
    networks:
      - bakery-network

volumes:
  mysql_data:

networks:
  bakery-network:
    driver: bridge